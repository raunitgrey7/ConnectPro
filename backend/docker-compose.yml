services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-conferencing-backend:latest
    container_name: video-conferencing-backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Video Conferencing Platform API"
      APP_ENV: production
      DEBUG: "false"
      API_PREFIX: /api
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: sqlite:////app/data/app.db
      CORS_ORIGINS: "http://localhost:3000"
      INVITE_BASE_URL: "http://localhost:3000/join"
      MEETING_ID_LENGTH: "10"
      SEED_ON_STARTUP: "true"
      LOG_LEVEL: INFO
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend_data:
