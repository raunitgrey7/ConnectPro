services:
  - type: web
    name: connectpro-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head || true"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # IMPORTANT: Render may assign a URL with a random suffix (e.g. connectpro-frontend-abc.onrender.com)
      # You MUST update these environment variables in the Render Dashboard once the frontend URL is known.
      - key: CORS_ORIGINS
        value: "https://connectpro-frontend.onrender.com"
      - key: INVITE_BASE_URL
        value: "https://connectpro-frontend.onrender.com/join"
      - key: DATABASE_URL
        value: "sqlite:///./app.db"

  - type: web
    name: connectpro-frontend
    env: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: 20.x
      # IMPORTANT: After initial deployment, update this with the actual generated backend URL
      - key: NEXT_PUBLIC_API_URL
        value: "https://connectpro-backend.onrender.com"
